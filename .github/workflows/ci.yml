name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install TA-Lib system dependency
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget
        wget -q https://github.com/ta-lib/ta-lib/releases/download/v0.6.4/ta-lib-0.6.4-src.tar.gz
        tar -xzf ta-lib-0.6.4-src.tar.gz
        cd ta-lib && ./configure --prefix=/usr && make -j$(nproc) && sudo make install && cd ..
        sudo ldconfig

    - name: Install dependencies
      env:
        LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu:/usr/lib:$LD_LIBRARY_PATH
        CFLAGS: -I/usr/include
        LDFLAGS: -L/usr/lib/x86_64-linux-gnu -L/usr/lib
      run: |
        python -m ensurepip --upgrade
        python -m pip install --upgrade pip
        pip install ta-lib --no-cache-dir
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check .
        ruff format --check .

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short --cov=core --cov=ml --cov=backtest --cov=config --cov-report=xml

    - name: Upload coverage
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
